<div class="sms-panel">
  <h2><i class="fas fa-sms"></i> SMS Panel</h2>
  <div class="form-group">
    <label>Phone Number</label>
    <input type="tel" [(ngModel)]="phoneNumber" placeholder="+628xxxxxxxxxx" required>
  </div>
  <div class="form-group">
    <label>Message</label>
    <textarea [(ngModel)]="message" rows="3" placeholder="Type your SMS message..." maxlength="160" required></textarea>
    <small *ngIf="message.length > 0">Remaining: {{ 160 - message.length }}</small>
  </div>
  <button class="btn btn-primary" [disabled]="loading || !phoneNumber || !message">
    <i *ngIf="!loading" class="fas fa-paper-plane"></i>
    <i *ngIf="loading" class="fas fa-spinner fa-spin"></i>
    {{ loading ? 'Sending...' : 'Send SMS' }}
  </button>
  <div *ngIf="success" class="alert alert-success">
    <i class="fas fa-check-circle"></i> SMS sent! SID: {{ sid }}
  </div>
  <div *ngIf="status" class="alert alert-info">{{ status }}</div>
</div>
